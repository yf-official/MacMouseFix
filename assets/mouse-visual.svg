<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-labelledby="title desc">
  <title id="title">Mouse control map</title>
  <desc id="desc">A stylized mouse with side buttons, wheel, and primary buttons.</desc>
